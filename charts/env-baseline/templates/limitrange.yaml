{{- if .Values.limitRange.enabled }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: {{ .Values.env }}-limits
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-9"
  labels:
    {{- include "env-baseline.commonLabels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      {{- with .Values.limitRange.default }}
      default: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.limitRange.defaultRequest }}
      defaultRequest: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.limitRange.max }}
      max: {{ toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
