# The credential Argo CD uses to read the cluster repo. Applied by hand, once.
#
# NEVER COMMITTED WITH A REAL VALUE. Fill it on the machine that applies it, or
# create it with `kubectl create secret`. Once the secret plane is running, this
# is the one Secret that still cannot come from it -- Argo CD has to read the
# repo before it can deploy the thing that would have supplied the credential.
# That circularity is why this file exists at all.
apiVersion: v1
kind: Secret
metadata:
  name: SET-a-name
  namespace: SET-argocd-namespace
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: SET-repo-url
  # Read-only. This token never needs to write; CI writes with its own.
  username: SET-username
  password: SET-token
