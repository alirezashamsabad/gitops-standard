# The second environment. Identical in shape to dev and different in the numbers,
# which is the whole point: an environment is a folder, not a flag.
tenant: acme
env: qa
namespace: acme-qa

quota:
  enabled: true
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "40"

limits:
  enabled: true
  default:        {cpu: 200m, memory: 256Mi}
  defaultRequest: {cpu: 50m,  memory: 128Mi}

# THE NAMESPACE OWNS POLICY, not a per-service chart. One owner, one place to
# read it.
#
# false here, and that is a decision rather than a gap: a NetworkPolicy selecting
# an endpoint makes that endpoint default-deny, so turning this on without the
# profiles that allow what actually talks to what takes the environment down.
network:
  enabled: false
  profiles: []
