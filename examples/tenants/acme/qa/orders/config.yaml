# orders @ acme/qa. A promotable unit: chart version, image tag, sync policy.
#
# The folder name is the service name. Nothing inside restates it, so the two
# cannot drift, and the Application this generates is acme-qa-orders.
namespace: acme-qa

chart:
  repo: apps                    # -> cluster.yaml:chartRepos
  name: application
  version: "9.0.0"

image:
  repository: mirror.internal/acme/orders
  # WRITTEN BY CI. The deploy job of this service's pipeline replaces this one
  # line and touches nothing else in this file. It is the only line in the whole
  # repository a pipeline edits.
  tag: v1.2.1

sync:
  automated: true
  selfHeal: true
  # FALSE on the environment closest to production, which is the one difference
  # in this file that is not a number. A folder removed by a bad rebase should not
  # take a running Deployment with it here.
  prune: false
